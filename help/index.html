<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aide — ExpoMetro</title>
<meta name="robots" content="noindex">
<meta name="description" content="Pose tes questions à ExpoMetro — réponse immédiate sur l'exposition de Florence.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.11.0/dist/tabler-icons.min.css">
<style>
  :root{
    --night:#070a17; --paper:#0e1431; --ink2:#0b0f1e;
    --head:#f4f6fa; --text:#aab2c4; --muted:#8b93a5; --faint:#6b7284;
    --accent:#FF5267; --accent-2:#ff6f80; --accent-d:#e23950;
    --line:rgba(255,255,255,.12); --line-2:rgba(255,255,255,.06);
    --maxw:720px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;font-family:var(--font);color:var(--text);line-height:1.55;
    background:
      radial-gradient(120% 55% at 50% -8%, rgba(255,82,103,.13), transparent 55%),
      radial-gradient(90% 50% at 100% 0, rgba(60,90,220,.10), transparent 60%),
      var(--night);
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit}

  /* ---------- HEADER (identique à la PDV) ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:11px 16px;border-bottom:1px solid var(--line-2);
    background:rgba(7,10,23,.82);backdrop-filter:saturate(140%) blur(10px)}
  .brand{display:flex;align-items:center;flex:none}
  .brand img{height:26px;width:auto;display:block}
  .topbar-right{display:flex;align-items:center;gap:14px}

  .lang{position:relative}
  .lang-btn{display:inline-flex;align-items:center;gap:6px;background:transparent;border:none;color:#fff;font-family:inherit;font-size:13px;font-weight:600;letter-spacing:.08em;cursor:pointer;padding:6px 4px}
  .lang-btn i{font-size:16px}
  .lang-menu{position:absolute;top:100%;right:0;margin-top:8px;background:rgba(9,11,26,.97);border:1px solid var(--line);border-radius:8px;padding:6px;min-width:150px;display:none;flex-direction:column;backdrop-filter:blur(8px);z-index:70}
  .lang-menu.open{display:flex}
  .lang-menu a{color:#fff;font-size:14px;text-decoration:none;padding:9px 12px;border-radius:6px;opacity:.85}
  .lang-menu a:hover{background:rgba(255,255,255,.08);opacity:1}
  .lang-menu a.active{color:var(--accent);opacity:1;font-weight:600}

  .pdv{display:inline-flex;align-items:center;white-space:nowrap;font-size:13px;font-weight:700;color:#fff;text-decoration:none;padding:9px 16px;border-radius:100px;background:linear-gradient(180deg,var(--accent),var(--accent-d));box-shadow:0 8px 22px -10px rgba(255,82,103,.75)}
  .pdv:hover{transform:translateY(-1px)}
  .pdv .ar{display:inline-block;transition:transform .15s ease}
  .pdv:hover .ar{transform:translateX(3px)}

  .page{max-width:var(--maxw);margin:0 auto;padding:0 16px;display:flex;flex-direction:column;min-height:calc(100vh - 53px)}

  /* ---------- HERO ---------- */
  .hero{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap;justify-content:center;padding:30px 4px 20px}
  .hero .me{
    width:152px;height:152px;border-radius:50%;object-fit:cover;object-position:50% 42%;flex:none;
    border:3px solid var(--accent);
    box-shadow:0 16px 44px -18px rgba(0,0,0,.7), 0 0 24px -3px rgba(255,82,103,.45)}
  .hero .welcome{flex:1 1 300px;min-width:260px;max-width:420px}
  .hero .welcome h1{color:var(--head);font-size:clamp(21px,4.6vw,27px);line-height:1.18;margin:0 0 10px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
  .hero .welcome h1 .em{color:var(--accent-2)}
  .hero .welcome p{margin:0;font-size:15px;color:var(--text)}
  @media (max-width:560px){
    .hero{padding:22px 4px 12px;gap:14px;align-items:center}
    .hero .me{width:120px;height:120px}
    .hero .welcome{text-align:center;flex-basis:100%}
  }

  /* ---------- CHAT (épuré, sans box) ---------- */
  .chat{display:flex;flex-direction:column;margin-bottom:12px}
  .atag{display:flex;align-items:center;justify-content:center;gap:7px;color:var(--muted);font-size:12px;font-weight:600;padding:2px 0 12px}
  .atag .dot{width:7px;height:7px;border-radius:50%;background:#7CFFB0;box-shadow:0 0 8px #7CFFB0}

  .msgs{overflow-y:auto;max-height:52vh;padding:4px 2px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
  .lead{color:var(--muted);font-size:13px;font-weight:600;text-align:center;margin:2px 0 0}
  .row{display:flex;max-width:90%}
  .row.u{align-self:flex-end}
  .row.a{align-self:flex-start;max-width:100%}
  .bub{font-size:15px;white-space:pre-wrap;word-wrap:break-word;color:var(--head);line-height:1.55}
  .row.a .bub{padding:0 2px}                    /* assistant = texte pur, aucune box */
  .row.u .bub{padding:10px 14px;border-radius:15px;background:linear-gradient(180deg,var(--accent),var(--accent-d));color:#fff;border-bottom-right-radius:5px}
  .bub a{color:var(--accent-2);font-weight:700;text-underline-offset:2px}
  .row.u .bub a{color:#fff}
  .bub .ln{display:block;margin:2px 0}
  .bub .hd{margin-top:8px}
  .bub .hr{display:block;height:1px;background:var(--line);margin:9px 0}

  .branch{display:flex;flex-direction:column;gap:8px;margin-top:2px;width:100%}
  .branch button{text-align:left;font:inherit;font-size:14.5px;font-weight:600;color:var(--head);cursor:pointer;
    background:rgba(255,255,255,.05);border:none;border-radius:12px;padding:13px 15px;
    transition:background .12s ease,transform .12s ease}
  .branch button:hover{background:rgba(255,255,255,.10);transform:translateY(-1px)}
  .branch button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .typing{display:inline-flex;gap:4px;align-items:center}
  .typing i{width:7px;height:7px;border-radius:50%;background:var(--faint);display:inline-block;animation:blink 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}

  .esc{flex:none;padding:6px 2px 8px;display:none;text-align:center}
  .esc.show{display:block}
  .esc button{font:inherit;font-size:13.5px;font-weight:700;cursor:pointer;color:var(--accent-2);
    background:transparent;border:none;padding:7px 12px;border-radius:10px}
  .esc button:hover{background:rgba(255,255,255,.06)}

  /* la SEULE box : écrire */
  .composer{flex:none;display:flex;gap:6px;align-items:center;
    padding:7px 7px 7px 15px;border:1px solid var(--line);border-radius:16px;background:var(--paper)}
  .composer textarea{flex:1 1 auto;min-width:0;resize:none;font:inherit;font-size:16px;color:var(--head);
    background:transparent;border:none;padding:6px 0;max-height:120px;line-height:1.4}
  .composer textarea::placeholder{color:var(--faint)}
  .composer textarea:focus{outline:none}
  .composer .snd{flex:none;width:42px;height:42px;border:0;border-radius:12px;cursor:pointer;
    background:linear-gradient(180deg,var(--accent),var(--accent-d));color:#fff;display:grid;place-items:center}
  .composer .snd:disabled{opacity:.45;cursor:default}
  .composer .snd svg{width:20px;height:20px}

  .form{border:1px solid var(--line);border-radius:15px;padding:14px;margin-top:4px;width:100%}
  .form h4{margin:0 0 10px;font-size:14px;color:var(--head)}
  .form input,.form textarea{width:100%;font:inherit;font-size:16px;color:var(--head);
    background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:9px}
  .form textarea{resize:vertical;min-height:80px;line-height:1.4}
  .form input:focus,.form textarea:focus{outline:none;border-color:rgba(255,255,255,.28)}
  .form .acts{display:flex;gap:8px}
  .form .acts button{flex:1;font:inherit;font-weight:700;cursor:pointer;border-radius:11px;padding:11px;border:1px solid var(--line)}
  .form .acts .go{background:linear-gradient(180deg,var(--accent),var(--accent-d));color:#fff;border:0}
  .form .acts .cx{background:transparent;color:var(--muted)}
  .form .err{color:#ff8a97;font-size:12.5px;margin:-2px 0 8px;display:none}

  footer{flex:none;margin-top:auto;text-align:center;color:var(--faint);font-size:11.5px;padding:12px 0 18px}
  footer b{color:var(--accent)}

  @media (max-width:420px){
    .topbar{padding:10px 12px;gap:8px}
    .cta-long{display:none}
    .page{padding:0 12px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto}}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" id="brand" target="_blank" rel="noopener"><img src="/florence/img/logo-color.png" alt="ExpoMetro"></a>
  <div class="topbar-right">
    <div class="lang">
      <button class="lang-btn" id="langBtn" aria-haspopup="true" aria-expanded="false"><i class="ti ti-world"></i> <span id="langCur">FR</span> <i class="ti ti-chevron-down"></i></button>
      <div class="lang-menu" id="langMenu"></div>
    </div>
    <a class="pdv" id="pdv" target="_blank" rel="noopener"><span class="cta-long">ExpoMetro&nbsp;</span>Florence&nbsp;<span class="ar">→</span></a>
  </div>
</header>

<div class="page">
  <section class="hero">
    <img class="me" src="/florence/img/rudolph.jpg" alt="Rudolph, fondateur d'ExpoMetro">
    <div class="welcome">
      <h1 id="heroTitle"></h1>
      <p id="heroBody"></p>
    </div>
  </section>

  <div class="chat">
    <div class="atag"><span class="dot"></span> Assistant ExpoMetro · <span id="stTxt">en ligne</span></div>
    <div class="msgs" id="msgs" aria-live="polite"></div>
    <div class="esc" id="esc"><button id="escBtn" type="button">✉️ Écrire à Rudolph</button></div>
    <form class="composer" id="composer" autocomplete="off">
      <textarea id="in" rows="1" placeholder="Écris ta question…"></textarea>
      <button class="snd" id="snd" type="submit" aria-label="Envoyer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>
      </button>
    </form>
  </div>

  <footer>Expo<b>Metro</b> · Art for everyone, everywhere</footer>
</div>

<script>
(function(){
  "use strict";
  var ESCALATE_AFTER = 2, API="/api/ask", CONTACT="/api/contact";

  var L = {
    fr:{status:"en ligne",
      heroTitle:"Bonjour ! 👋 Je suis Rudolph, <span class='em'>fondateur d'ExpoMetro.</span>",
      heroBody:"Je reçois de nombreuses demandes d'artistes du monde entier. Tu peux me poser toutes tes questions ci-dessous.\n\nEt si tu n'obtiens pas ta réponse, tu peux me contacter — je réponds toujours personnellement.",
      start:"Par où veux-tu commencer ?",
      bNew:"🆕 Je découvre ExpoMetro",bBooked:"✅ J'ai déjà réservé ma place",
      pNew:"Super ! Pose-moi ta question — la vision, l'expo de Florence, comment ça marche, la photo de ton œuvre, les prix…",
      pBooked:"Parfait ! Dis-moi comment t'aider — envoyer ton œuvre, ton compte, les infos pratiques de l'expo…",
      ph:"Écris ta question…",esc:"✉️ Écrire à Rudolph",
      fTitle:"✉️ Écris à Rudolph — il te répond en personne",fEmail:"Ton email",fMsg:"Ta question pour Rudolph…",
      fGo:"Envoyer à Rudolph",fCx:"Annuler",fErr:"Merci d'indiquer un email valide et un message.",
      fSent:"Merci ! Rudolph a bien reçu ton message et te répondra personnellement. 💛",
      err:"Oups, une erreur est survenue. Réessaie dans un instant."},
    en:{status:"online",
      heroTitle:"Hi! 👋 I'm Rudolph, <span class='em'>founder of ExpoMetro.</span>",
      heroBody:"I get many messages from artists all over the world. You can ask me all your questions below.\n\nAnd if you don't find your answer, you can contact me — I always reply personally.",
      start:"Where would you like to start?",
      bNew:"🆕 I'm discovering ExpoMetro",bBooked:"✅ I've already booked my spot",
      pNew:"Great! Ask me anything — the vision, the Florence exhibition, how it works, your artwork photo, prices…",
      pBooked:"Perfect! Tell me how I can help — uploading your artwork, your account, practical info…",
      ph:"Type your question…",esc:"✉️ Write to Rudolph",
      fTitle:"✉️ Write to Rudolph — he replies personally",fEmail:"Your email",fMsg:"Your question for Rudolph…",
      fGo:"Send to Rudolph",fCx:"Cancel",fErr:"Please enter a valid email and a message.",
      fSent:"Thank you! Rudolph has received your message and will reply personally. 💛",
      err:"Oops, something went wrong. Please try again in a moment."},
    es:{status:"en línea",
      heroTitle:"¡Hola! 👋 Soy Rudolph, <span class='em'>fundador de ExpoMetro.</span>",
      heroBody:"Recibo muchísimos mensajes de artistas de todo el mundo. Puedes hacerme todas tus preguntas aquí abajo.\n\nY si no encuentras tu respuesta, puedes contactarme — siempre respondo personalmente.",
      start:"¿Por dónde quieres empezar?",
      bNew:"🆕 Estoy descubriendo ExpoMetro",bBooked:"✅ Ya he reservado mi plaza",
      pNew:"¡Genial! Pregúntame lo que quieras — la visión, la exposición de Florencia, cómo funciona, la foto de tu obra, los precios…",
      pBooked:"¡Perfecto! Dime cómo ayudarte — subir tu obra, tu cuenta, información práctica…",
      ph:"Escribe tu pregunta…",esc:"✉️ Escribir a Rudolph",
      fTitle:"✉️ Escribe a Rudolph — te responde en persona",fEmail:"Tu email",fMsg:"Tu pregunta para Rudolph…",
      fGo:"Enviar a Rudolph",fCx:"Cancelar",fErr:"Por favor indica un email válido y un mensaje.",
      fSent:"¡Gracias! Rudolph ha recibido tu mensaje y te responderá personalmente. 💛",
      err:"Vaya, ha ocurrido un error. Inténtalo de nuevo en un momento."},
    it:{status:"online",
      heroTitle:"Ciao! 👋 Sono Rudolph, <span class='em'>fondatore di ExpoMetro.</span>",
      heroBody:"Ricevo moltissime richieste da artisti di tutto il mondo. Puoi farmi tutte le tue domande qui sotto.\n\nE se non trovi la tua risposta, puoi contattarmi — rispondo sempre personalmente.",
      start:"Da dove vuoi iniziare?",
      bNew:"🆕 Sto scoprendo ExpoMetro",bBooked:"✅ Ho già prenotato il mio posto",
      pNew:"Benissimo! Chiedimi pure — la visione, l'esposizione di Firenze, come funziona, la foto della tua opera, i prezzi…",
      pBooked:"Perfetto! Dimmi come aiutarti — caricare la tua opera, il tuo account, info pratiche…",
      ph:"Scrivi la tua domanda…",esc:"✉️ Scrivi a Rudolph",
      fTitle:"✉️ Scrivi a Rudolph — ti risponde di persona",fEmail:"La tua email",fMsg:"La tua domanda per Rudolph…",
      fGo:"Invia a Rudolph",fCx:"Annulla",fErr:"Inserisci un'email valida e un messaggio.",
      fSent:"Grazie! Rudolph ha ricevuto il tuo messaggio e ti risponderà personalmente. 💛",
      err:"Ops, si è verificato un errore. Riprova tra un istante."},
    de:{status:"online",
      heroTitle:"Hallo! 👋 Ich bin Rudolph, <span class='em'>Gründer von ExpoMetro.</span>",
      heroBody:"Ich erhalte viele Nachrichten von Künstlern aus aller Welt. Du kannst mir all deine Fragen hier unten stellen.\n\nUnd wenn du keine Antwort findest, kannst du mich kontaktieren — ich antworte immer persönlich.",
      start:"Wo möchtest du starten?",
      bNew:"🆕 Ich entdecke ExpoMetro",bBooked:"✅ Ich habe meinen Platz schon gebucht",
      pNew:"Super! Frag mich alles — die Vision, die Florenz-Ausstellung, wie es funktioniert, dein Kunstwerk-Foto, Preise…",
      pBooked:"Perfekt! Sag mir, wie ich helfen kann — Kunstwerk hochladen, dein Konto, praktische Infos…",
      ph:"Schreib deine Frage…",esc:"✉️ Rudolph schreiben",
      fTitle:"✉️ Schreib Rudolph — er antwortet persönlich",fEmail:"Deine E-Mail",fMsg:"Deine Frage an Rudolph…",
      fGo:"An Rudolph senden",fCx:"Abbrechen",fErr:"Bitte gib eine gültige E-Mail und eine Nachricht ein.",
      fSent:"Danke! Rudolph hat deine Nachricht erhalten und antwortet dir persönlich. 💛",
      err:"Ups, etwas ist schiefgelaufen. Bitte versuche es gleich noch einmal."}
  };
  var LANG_NAMES={en:"English",fr:"Français",es:"Español",it:"Italiano",de:"Deutsch"};
  var ORDER=["en","fr","es","it","de"];

  function pickLang(){
    var q=(new URLSearchParams(location.search)).get("lang");
    var raw=(q||navigator.language||"fr").slice(0,2).toLowerCase();
    return L[raw]?raw:"fr";
  }
  var lang=pickLang(), t=L[lang];
  document.documentElement.lang=lang;
  function pdvURL(lg){ return "https://artinthe.city/"+(lg==="en"?"":lg+"/")+"florence"; }

  var $=function(s){return document.querySelector(s)};
  var msgsEl=$("#msgs"), inEl=$("#in"), sndEl=$("#snd"), escEl=$("#esc"), escBtn=$("#escBtn");

  // header : sélecteur de langue (dropdown, comme la PDV) + CTA
  $("#langCur").textContent=lang.toUpperCase();
  var langBtn=$("#langBtn"), langMenu=$("#langMenu");
  ORDER.forEach(function(code){
    var a=document.createElement("a"); a.href=location.pathname+"?lang="+code; a.textContent=LANG_NAMES[code];
    if(code===lang) a.className="active"; langMenu.appendChild(a);
  });
  langBtn.addEventListener("click",function(e){e.stopPropagation();var o=langMenu.classList.toggle("open");langBtn.setAttribute("aria-expanded",o);});
  document.addEventListener("click",function(){langMenu.classList.remove("open");langBtn.setAttribute("aria-expanded",false);});
  $("#pdv").href=pdvURL(lang); $("#brand").href=pdvURL(lang);

  // textes
  $("#heroTitle").innerHTML=t.heroTitle; $("#heroBody").textContent=t.heroBody;
  $("#stTxt").textContent=t.status; inEl.placeholder=t.ph; escBtn.textContent=t.esc;

  var messages=[], profile=null, askCount=0, busy=false;

  function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
  function fmt(raw){
    var s=esc(raw).replace(/\[([^\]]+)\]\((?:lien[_a-z]*|url|#)\)/gi,"$1");
    s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
    s=s.replace(/(^|[^"'>=])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
    s=s.replace(/^\s*#{1,6}\s+(.+?)\s*$/gm,'<span class="ln hd"><strong>$1</strong></span>');
    s=s.replace(/^\s*([-*_])\1{2,}\s*$/gm,'<span class="hr"></span>');
    s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
    s=s.replace(/^\s*[-•]\s+(.*)$/gm,'<span class="ln">• $1</span>');
    return s;
  }
  function bubble(role,html){
    var row=document.createElement("div"); row.className="row "+(role==="u"?"u":"a");
    var b=document.createElement("div"); b.className="bub"; b.innerHTML=html; row.appendChild(b);
    msgsEl.appendChild(row); scroll(); return row;
  }
  function scroll(){ msgsEl.scrollTop=msgsEl.scrollHeight }

  inEl.focus();

  function autogrow(){ inEl.style.height="auto"; inEl.style.height=Math.min(inEl.scrollHeight,120)+"px"; }
  inEl.addEventListener("input",autogrow);
  inEl.addEventListener("keydown",function(e){ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); $("#composer").requestSubmit(); } });

  $("#composer").addEventListener("submit",function(e){
    e.preventDefault();
    var text=inEl.value.trim(); if(!text||busy) return;
    inEl.value=""; autogrow();
    bubble("u",esc(text)); messages.push({role:"user",content:text}); askCount++; send();
  });

  function send(){
    busy=true; sndEl.disabled=true;
    var tr=bubble("a",'<span class="typing"><i></i><i></i><i></i></span>');
    fetch(API,{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({messages:messages.slice(-12),lang:lang,profile:profile})})
    .then(function(r){return r.json()})
    .then(function(d){
      tr.remove();
      var reply=(d&&d.reply)?d.reply:t.err;
      messages.push({role:"assistant",content:reply});
      bubble("a",fmt(reply));
      if(askCount>=ESCALATE_AFTER) escEl.classList.add("show");
    })
    .catch(function(){ tr.remove(); bubble("a",esc(t.err)); })
    .finally(function(){ busy=false; sndEl.disabled=false; inEl.focus(); });
  }

  escBtn.addEventListener("click",function(){
    escEl.classList.remove("show");
    var row=document.createElement("div"); row.className="row a"; row.style.maxWidth="100%";
    var f=document.createElement("div"); f.className="form";
    f.innerHTML='<h4>'+esc(t.fTitle)+'</h4>'+
      '<input type="email" id="cEmail" placeholder="'+esc(t.fEmail)+'">'+
      '<textarea id="cMsg" placeholder="'+esc(t.fMsg)+'"></textarea>'+
      '<div class="err" id="cErr">'+esc(t.fErr)+'</div>'+
      '<div class="acts"><button type="button" class="cx" id="cCx">'+esc(t.fCx)+'</button>'+
      '<button type="button" class="go" id="cGo">'+esc(t.fGo)+'</button></div>';
    row.appendChild(f); msgsEl.appendChild(row); scroll();
    var lastQ=""; for(var i=messages.length-1;i>=0;i--){ if(messages[i].role==="user"){lastQ=messages[i].content;break;} }
    f.querySelector("#cMsg").value=lastQ;
    f.querySelector("#cCx").onclick=function(){ row.remove(); escEl.classList.add("show"); };
    f.querySelector("#cGo").onclick=function(){
      var email=f.querySelector("#cEmail").value.trim(), msg=f.querySelector("#cMsg").value.trim();
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)||!msg){ f.querySelector("#cErr").style.display="block"; return; }
      f.querySelector("#cGo").disabled=true;
      fetch(CONTACT,{method:"POST",headers:{"content-type":"application/json"},
        body:JSON.stringify({email:email,message:msg,history:messages.slice(-12),lang:lang})})
      .then(function(){ row.remove(); bubble("a",esc(t.fSent)); })
      .catch(function(){ var er=f.querySelector("#cErr"); er.textContent=t.err; er.style.display="block"; f.querySelector("#cGo").disabled=false; });
    };
  });
})();
</script>
</body>
</html>

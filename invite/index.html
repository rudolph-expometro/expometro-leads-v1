<!-- Redirection JS (les crawlers d'aperçu ne l'exécutent pas -> ils lisent bien l'Open Graph ci-dessus).
     Détecte la langue du visiteur -> page candidature dans sa langue + tracking parrainage. -->
<script>
(function(){
  var q = "?utm_source=parrainage&utm_medium=referral&utm_campaign=florence_500";
  var l = (navigator.language || navigator.userLanguage || "en").toLowerCase();
  var base;
  if (l.indexOf("fr") === 0)      base = "/fr/apply-florence";
  else if (l.indexOf("es") === 0) base = "/es/apply-florence";
  else if (l.indexOf("it") === 0) base = "/it/apply-florence";
  else if (l.indexOf("de") === 0) base = "/de/apply-florence";
  else                            base = "/apply-florence"; // EN = racine
  location.replace(base + q);
})();
</script>
</head>
<body style="background:#070a17;color:#fff;font-family:system-ui,-apple-system,sans-serif;text-align:center;padding:48px 20px">
  <p style="font-size:1.05rem">Redirection en cours…</p>

</body>
</html>

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ExpoMetro — Florence</title>
<meta name="robots" content="noindex">
<meta name="description" content="Rejoins l'exposition d'art immersif d'ExpoMetro à Florence.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.11.0/dist/tabler-icons.min.css">
<style>
  :root{
    --night:#070a17; --paper:#0e1431; --ink2:#0b0f1e;
    --head:#f4f6fa; --text:#aab2c4; --muted:#8b93a5; --faint:#6b7284;
    --accent:#FF5267; --accent-2:#ff6f80; --accent-d:#e23950;
    --ok:#22e06b;
    --line:rgba(255,255,255,.12); --line-2:rgba(255,255,255,.06);
    --maxw:600px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;font-family:var(--font);color:var(--text);line-height:1.55;
    background:
      radial-gradient(120% 55% at 50% -8%, rgba(255,82,103,.13), transparent 55%),
      radial-gradient(90% 50% at 100% 0, rgba(60,90,220,.10), transparent 60%),
      var(--night);
    -webkit-font-smoothing:antialiased;min-height:100%;display:flex;flex-direction:column}
  a{color:inherit;text-decoration:none}

  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:11px 16px;border-bottom:1px solid var(--line-2);background:rgba(7,10,23,.82);backdrop-filter:saturate(140%) blur(10px)}
  .brand img{height:26px;width:auto;display:block}
  .lang{position:relative}
  .lang-btn{display:inline-flex;align-items:center;gap:6px;background:transparent;border:none;color:#fff;font-family:inherit;font-size:13px;font-weight:600;letter-spacing:.08em;cursor:pointer;padding:6px 4px}
  .lang-btn i{font-size:16px}
  .lang-menu{position:absolute;top:100%;right:0;margin-top:8px;background:rgba(9,11,26,.97);border:1px solid var(--line);border-radius:8px;padding:6px;min-width:150px;display:none;flex-direction:column;backdrop-filter:blur(8px);z-index:70}
  .lang-menu.open{display:flex}
  .lang-menu a{color:#fff;font-size:14px;padding:9px 12px;border-radius:6px;opacity:.85}
  .lang-menu a:hover{background:rgba(255,255,255,.08);opacity:1}
  .lang-menu a.active{color:var(--accent);opacity:1;font-weight:600}

  .wrap{flex:1;max-width:var(--maxw);width:100%;margin:0 auto;padding:0 18px;display:flex;flex-direction:column;justify-content:center}
  .hero{text-align:center;padding:34px 4px 26px}
  .hero .me{width:74px;height:74px;border-radius:50%;object-fit:cover;object-position:50% 22%;
    border:2px solid var(--accent);box-shadow:0 0 22px -4px rgba(255,82,103,.45);margin:0 0 16px}
  .hero h1{color:var(--head);font-size:clamp(23px,5.6vw,30px);font-weight:800;letter-spacing:-.01em;margin:0 0 8px;text-wrap:balance}
  .hero p{margin:0;color:var(--muted);font-size:15px}

  .choices{display:flex;flex-direction:column;gap:14px;padding-bottom:10px}
  .card{display:flex;align-items:center;gap:15px;padding:20px 20px;border-radius:18px;border:1px solid var(--line);
    background:linear-gradient(180deg,var(--paper),rgba(14,20,49,.5));cursor:pointer;
    transition:transform .14s ease,border-color .14s ease,box-shadow .14s ease}
  .card:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.28);box-shadow:0 18px 40px -22px rgba(0,0,0,.8)}
  .card:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .card .emo{font-size:30px;line-height:1;flex:none}
  .card .txt{flex:1;min-width:0}
  .card .t{display:block;color:var(--head);font-weight:800;font-size:17px;line-height:1.2;margin:0 0 4px}
  .card .s{display:block;color:var(--muted);font-size:13.5px;line-height:1.35}
  .card .arr{flex:none;color:var(--accent-2);font-size:22px;line-height:1;transition:transform .14s ease}
  .card:hover .arr{transform:translateX(3px)}
  .card.member{border-color:rgba(34,224,107,.28);background:linear-gradient(180deg,rgba(34,224,107,.07),rgba(14,20,49,.5))}
  .card.member:hover{border-color:rgba(34,224,107,.5)}
  .card.member .arr{color:var(--ok)}

  footer{text-align:center;color:var(--faint);font-size:11.5px;padding:22px 0 22px}
  footer b{color:var(--accent)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" id="brand" href="#" aria-label="ExpoMetro"><img src="/florence/img/logo-color.png" alt="ExpoMetro"></a>
  <div class="lang">
    <button class="lang-btn" id="langBtn" aria-haspopup="true" aria-expanded="false"><i class="ti ti-world"></i> <span id="langCur">FR</span> <i class="ti ti-chevron-down"></i></button>
    <div class="lang-menu" id="langMenu"></div>
  </div>
</header>

<main class="wrap">
  <div class="hero">
    <img class="me" src="/florence/img/rudolph.jpg" alt="Rudolph, ExpoMetro">
    <h1 id="hTitle"></h1>
    <p id="hSub"></p>
  </div>

  <div class="choices">
    <a class="card new" id="cNew" href="#">
      <span class="emo">🆕</span>
      <span class="txt"><span class="t" id="nT"></span><span class="s" id="nS"></span></span>
      <span class="arr">→</span>
    </a>
    <a class="card member" id="cMember" href="#">
      <span class="emo">✅</span>
      <span class="txt"><span class="t" id="mT"></span><span class="s" id="mS"></span></span>
      <span class="arr">→</span>
    </a>
  </div>
</main>

<footer>Expo<b>Metro</b> · Art for everyone, everywhere</footer>

<script>
(function(){
  "use strict";
  var L={
    fr:{cur:"FR",title:"Bonjour&nbsp;👋",sub:"Par où veux-tu commencer&nbsp;?",
      nT:"Je découvre ExpoMetro",nS:"Découvre l'expo de Florence et rejoins le mouvement",
      mT:"Je suis déjà membre",mS:"Réserve ta place pour Florence"},
    en:{cur:"EN",title:"Hi&nbsp;👋",sub:"Where would you like to start?",
      nT:"I'm discovering ExpoMetro",nS:"Discover the Florence exhibition and join the movement",
      mT:"I'm already a member",mS:"Book your spot for Florence"},
    es:{cur:"ES",title:"¡Hola&nbsp;👋",sub:"¿Por dónde quieres empezar?",
      nT:"Estoy descubriendo ExpoMetro",nS:"Descubre la exposición de Florencia y únete al movimiento",
      mT:"Ya soy miembro",mS:"Reserva tu plaza para Florencia"},
    it:{cur:"IT",title:"Ciao&nbsp;👋",sub:"Da dove vuoi iniziare?",
      nT:"Sto scoprendo ExpoMetro",nS:"Scopri l'esposizione di Firenze e unisciti al movimento",
      mT:"Sono già membro",mS:"Prenota il tuo posto per Firenze"},
    de:{cur:"DE",title:"Hallo&nbsp;👋",sub:"Wo möchtest du starten?",
      nT:"Ich entdecke ExpoMetro",nS:"Entdecke die Florenz-Ausstellung und werde Teil der Bewegung",
      mT:"Ich bin bereits Mitglied",mS:"Sichere dir deinen Platz für Florenz"}
  };
  var NAMES={en:"English",fr:"Français",es:"Español",it:"Italiano",de:"Deutsch"};
  var ORDER=["en","fr","es","it","de"];

  var params=new URLSearchParams(location.search);
  var qlang=params.get("lang");
  var lang=(qlang||navigator.language||"fr").slice(0,2).toLowerCase();
  if(!L[lang]) lang="fr";
  var t=L[lang];
  document.documentElement.lang=lang;

  // UTM/tracking à transmettre aux 2 destinations (tout sauf "lang")
  var fwd=new URLSearchParams(location.search); fwd.delete("lang");
  var qs=fwd.toString();
  var prefix=(lang==="en")?"":lang+"/";
  function dest(path){ return "/"+prefix+path+(qs?("?"+qs):""); }

  var $=function(s){return document.querySelector(s)};
  $("#hTitle").innerHTML=t.title; $("#hSub").innerHTML=t.sub;
  $("#nT").textContent=t.nT; $("#nS").textContent=t.nS;
  $("#mT").textContent=t.mT; $("#mS").textContent=t.mS;
  $("#langCur").textContent=t.cur;
  $("#cNew").href=dest("apply-florence");
  $("#cMember").href=dest("florence-member");
  $("#brand").href=dest("florence-member");  // le logo mène à la PDV (garde les UTM)

  // sélecteur de langue (recharge en gardant les UTM)
  var langMenu=$("#langMenu"), langBtn=$("#langBtn");
  ORDER.forEach(function(code){
    var p=new URLSearchParams(location.search); p.set("lang",code);
    var a=document.createElement("a"); a.href=location.pathname+"?"+p.toString(); a.textContent=NAMES[code];
    if(code===lang) a.className="active"; langMenu.appendChild(a);
  });
  langBtn.addEventListener("click",function(e){e.stopPropagation();var o=langMenu.classList.toggle("open");langBtn.setAttribute("aria-expanded",o);});
  document.addEventListener("click",function(){langMenu.classList.remove("open");langBtn.setAttribute("aria-expanded",false);});
})();
</script>
</body>
</html>
